<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surah Yasin - Klasik Islami Mewah</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-parchment: #F5F1E3;
            --gold-primary: #C5A059;
            --gold-light: #E5C158;
            --gold-dark: #8A6D29;
            --shadow-color: rgba(62, 39, 35, 0.2);
            --text-arabic: #1A1A1A;
            --text-latin: #2C2C2C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2A2421;
            font-family: 'Crimson Pro', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* App Container / Frame */
        .app-card {
            background-color: var(--bg-parchment);
            background-image: radial-gradient(#E8E2CE 1px, transparent 1px);
            background-size: 16px 16px;
            width: 100%;
            max-width: 800px;
            min-height: 90vh;
            border: 12px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark)) 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 50px var(--shadow-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Header Styles */
        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-primary);
            padding-bottom: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            color: var(--gold-dark);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2), 0 0 5px rgba(197, 160, 89, 0.3);
            margin-bottom: 5px;
        }

        .header-meta {
            font-size: 1.1rem;
            color: #5D4037;
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* Controls / Toggle */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-toggle {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #FFF;
            border: none;
            padding: 8px 16px;
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .btn-toggle:hover {
            filter: brightness(1.1);
        }

        /* Content Container */
        .verse-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            max-height: 60vh;
            padding-right: 10px;
        }

        /* Scrollbar Styling */
        .verse-container::-webkit-scrollbar {
            width: 6px;
        }
        .verse-container::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 3px;
        }

        .verse-item {
            border-bottom: 1px dashed rgba(197, 160, 89, 0.5);
            padding-bottom: 15px;
            transition: all 0.3s ease;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: var(--text-arabic);
            text-align: right;
            line-height: 2.2;
            direction: rtl;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .translation-text {
            font-size: 1.05rem;
            color: var(--text-latin);
            line-height: 1.6;
            text-align: left;
            transition: opacity 0.3s ease;
        }

        /* Focus Mode Classes */
        .focus-mode .arabic-text {
            text-align: center;
            font-size: 2.6rem;
            margin: 20px 0;
        }

        .focus-mode .translation-text {
            display: none;
        }

        /* Loading & Error States */
        .status-message {
            text-align: center;
            font-size: 1.2rem;
            color: var(--gold-dark);
            margin-top: 50px;
        }

        /* Footer & Engraved 3D Developer Text */
        .footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .developer-tag {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            color: #B38E46;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.6), 1px 1px 1px rgba(0, 0, 0, 0.8);
            background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">سورة يس</h1>
            <div class="header-meta">
                <span>Surah ke-36</span>
                <span>•</span>
                <span>Makkiyah</span>
                <span>•</span>
                <span>83 Ayat</span>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls">
            <button class="btn-toggle" id="toggleBtn" onclick="toggleTranslation()">Sembunyikan Terjemahan</button>
        </div>

        <!-- Main Content -->
        <main class="verse-container" id="verseContainer">
            <div class="status-message">Memuat ayat-ayat Surah Yasin...</div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="developer-tag">developer : fatur62</div>
        </footer>
    </div>

    <script>
        // State Management
        let showTranslation = true;

        // Fetching Data Surah Yasin (36) dari API Kemenag / Equran.id (Validasi Aman)
        async function loadSurahYasin() {
            const container = document.getElementById('verseContainer');
            try {
                const response = await fetch('https://equran.id/api/v2/surat/36');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const jsonResult = await response.json();

                // Safety validation parsing JSON
                if (!jsonResult || !jsonResult.data || !Array.isArray(jsonResult.data.ayat)) {
                    throw new Error('Format data JSON tidak sesuai struktur.');
                }

                renderAyat(jsonResult.data.ayat);
            } catch (error) {
                console.error('Error fetching data:', error);
                container.innerHTML = `<div class="status-message" style="color: #D32F2F;">Gagal memuat data ayat. Silakan coba lagi nanti.</div>`;
            }
        }

        // Render Ayat ke DOM
        function renderAyat(ayatList) {
            const container = document.getElementById('verseContainer');
            container.innerHTML = '';

            ayatList.forEach(ayat => {
                const nomorAyat = ayat.nomorAyat || '';
                const teksArab = ayat.teksArab || '';
                const teksIndonesia = ayat.teksIndonesia || '';

                const verseItem = document.createElement('div');
                verseItem.className = 'verse-item';
                verseItem.innerHTML = `
                    <div class="arabic-text">${teksArab} ﴿${nomorAyat}﴾</div>
                    <div class="translation-text">${nomorAyat}. ${teksIndonesia}</div>
                `;
                container.appendChild(verseItem);
            });
        }

        // Feature Toggle Terjemahan & Focus Mode
        function toggleTranslation() {
            const appCard = document.getElementById('appCard');
            const toggleBtn = document.getElementById('toggleBtn');
            
            showTranslation = !showTranslation;

            if (showTranslation) {
                appCard.classList.remove('focus-mode');
                toggleBtn.innerText = 'Sembunyikan Terjemahan';
            } else {
                appCard.classList.add('focus-mode');
                toggleBtn.innerText = 'Tampilkan Terjemahan';
            }
        }

        // Inisialisasi saat Halaman Dimuat
        document.addEventListener('DOMContentLoaded', () => {
            loadSurahYasin();
        });
    </script>
</body>
</html>
