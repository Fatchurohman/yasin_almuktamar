<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surah Yasin - Klasik Islami Mewah</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-parchment: #F5F1E3;
            --gold-light: #F4E0A5;
            --gold-primary: #C5A059;
            --gold-dark: #8A6D29;
            --gold-deep: #5A4419;
            --shadow-color: rgba(62, 39, 35, 0.3);
            --text-arabic: #1A1A1A;
            --text-latin: #2C2C2C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1E1815;
            font-family: 'Crimson Pro', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* App Container / Luxury Artistic Frame */
        .app-card {
            background-color: var(--bg-parchment);
            background-image: radial-gradient(#E8E2CE 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100%;
            max-width: 850px;
            min-height: 92vh;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 70px var(--shadow-color);
            
            /* Artistic Luxury Gold Border Style */
            border: 14px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        /* Shimmer / Light Glow Effect on Frame */
        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.35) 50%,
                transparent 55%
            );
            transform: rotate(30deg);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        /* Inner Decorative Border Frame */
        .inner-frame {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid var(--gold-primary);
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Corner Arabesque Ornaments */
        .corner-ornament {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--gold-dark);
            z-index: 2;
        }
        .corner-tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .corner-tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .corner-br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        /* Header Styles */
        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-primary);
            padding-bottom: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--gold-deep);
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8), 0 0 10px rgba(197, 160, 89, 0.5);
            margin-bottom: 5px;
        }

        .header-meta {
            font-size: 1.15rem;
            color: #5D4037;
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 15px;
            letter-spacing: 0.5px;
        }

        /* Controls / Toggle */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            z-index: 3;
        }

        .btn-toggle {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            color: #1A1A1A;
            border: 1px solid var(--gold-dark);
            padding: 8px 18px;
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 3px 6px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .btn-toggle:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Content Container */
        .verse-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            max-height: 55vh;
            padding-right: 12px;
            padding-left: 5px;
            z-index: 3;
        }

        /* Scrollbar Styling */
        .verse-container::-webkit-scrollbar {
            width: 6px;
        }
        .verse-container::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 3px;
        }

        .verse-item {
            border-bottom: 1px dashed rgba(197, 160, 89, 0.6);
            padding-bottom: 18px;
            transition: all 0.3s ease;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2.3rem;
            color: var(--text-arabic);
            text-align: right;
            line-height: 2.3;
            direction: rtl;
            margin-bottom: 10px;
            text-shadow: 0 0 1px rgba(0,0,0,0.1);
        }

        .translation-text {
            font-size: 1.1rem;
            color: var(--text-latin);
            line-height: 1.6;
            text-align: left;
        }

        /* Focus Mode Classes */
        .focus-mode .arabic-text {
            text-align: center;
            font-size: 2.8rem;
            margin: 25px 0;
        }

        .focus-mode .translation-text {
            display: none;
        }

        /* Loading & Error States */
        .status-message {
            text-align: center;
            font-size: 1.2rem;
            color: var(--gold-deep);
            margin-top: 50px;
            font-weight: 600;
        }

        /* Footer & Engraved 3D Developer Text */
        .footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 3;
        }

        .developer-tag {
            font-size: 1rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 2px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.7), 1px 1px 2px rgba(62, 39, 35, 0.6);
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        <!-- Corner Ornaments for Artistic Touch -->
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>
        <div class="inner-frame"></div>

        <!-- Header -->
        <header class="header">
            <h1 class="header-title">سورة يس</h1>
            <div class="header-meta">
                <span>Surah ke-36</span>
                <span>•</span>
                <span>Makkiyah</span>
                <span>•</span>
                <span>83 Ayat</span>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls">
            <button class="btn-toggle" id="toggleBtn" onclick="toggleTranslation()">Sembunyikan Terjemahan</button>
        </div>

        <!-- Main Content -->
        <main class="verse-container" id="verseContainer">
            <div class="status-message">Memuat ayat-ayat Surah Yasin...</div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="developer-tag">developer : fatur62</div>
        </footer>
    </div>

    <script>
        // State Management
        let showTranslation = true;

        // Fetching Data Surah Yasin (36) dari API Kemenag / Equran.id (Validasi Aman)
        async function loadSurahYasin() {
            const container = document.getElementById('verseContainer');
            try {
                const response = await fetch('https://equran.id/api/v2/surat/36');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const jsonResult = await response.json();

                // Safety validation parsing JSON
                if (!jsonResult || !jsonResult.data || !Array.isArray(jsonResult.data.ayat)) {
                    throw new Error('Format data JSON tidak sesuai struktur.');
                }

                renderAyat(jsonResult.data.ayat);
            } catch (error) {
                console.error('Error fetching data:', error);
                container.innerHTML = `<div class="status-message" style="color: #D32F2F;">Gagal memuat data ayat. Silakan coba lagi nanti.</div>`;
            }
        }

        // Render Ayat ke DOM
        function renderAyat(ayatList) {
            const container = document.getElementById('verseContainer');
            container.innerHTML = '';

            ayatList.forEach(ayat => {
                const nomorAyat = ayat.nomorAyat || '';
                const teksArab = ayat.teksArab || '';
                const teksIndonesia = ayat.teksIndonesia || '';

                const verseItem = document.createElement('div');
                verseItem.className = 'verse-item';
                verseItem.innerHTML = `
                    <div class="arabic-text">${teksArab} ﴿${nomorAyat}﴾</div>
                    <div class="translation-text">${nomorAyat}. ${teksIndonesia}</div>
                `;
                container.appendChild(verseItem);
            });
        }

        // Feature Toggle Terjemahan & Focus Mode
        function toggleTranslation() {
            const appCard = document.getElementById('appCard');
            const toggleBtn = document.getElementById('toggleBtn');
            
            showTranslation = !showTranslation;

            if (showTranslation) {
                appCard.classList.remove('focus-mode');
                toggleBtn.innerText = 'Sembunyikan Terjemahan';
            } else {
                appCard.classList.add('focus-mode');
                toggleBtn.innerText = 'Tampilkan Terjemahan';
            }
        }

        // Inisialisasi saat Halaman Dimuat
        document.addEventListener('DOMContentLoaded', () => {
            loadSurahYasin();
        });
    </script>
</body>
</html>
