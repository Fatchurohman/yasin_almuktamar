<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yasin Glorious Emerald Edition</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark-emerald: #0B2B1B;
            --bg-parchment-green: #0E3522;
            --gold-light: #F8E49A;
            --gold-primary: #E5C158;
            --gold-glorious: #D4AF37;
            --gold-dark: #9A7B1C;
            --gold-deep: #5E4A0F;
            --shadow-color: rgba(3, 15, 9, 0.7);
            --text-latin: #E0EADF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05140C;
            font-family: 'Crimson Pro', serif;
        }

        .app-card {
            background-color: var(--bg-parchment-green);
            background-image: radial-gradient(#14482E 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 0 60px var(--shadow-color);
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(254, 238, 185, 0.3) 50%, transparent 55%);
            transform: rotate(30deg);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        .corner-ornament {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid var(--gold-glorious);
            z-index: 2;
            pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .corner-tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .corner-br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-glorious);
            padding-bottom: 6px;
            margin-bottom: 6px;
            position: relative;
            z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--gold-light);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), 0 0 10px rgba(212, 175, 55, 0.6);
            margin-bottom: 2px;
        }

        .header-meta {
            font-size: 0.8rem;
            color: var(--gold-primary);
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 3px;
        }

        .developer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
        }

        .live-indicator {
            width: 7px;
            height: 7px;
            background-color: #00FF66;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(0, 255, 102, 0.4);
            animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .developer-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Panel Kontrol Ramah Lansia */
        .lansia-controls {
            background: rgba(3, 15, 9, 0.8);
            border: 1px solid var(--gold-glorious);
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 6px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 700;
        }

        .font-size-buttons {
            display: flex;
            gap: 4px;
        }

        .btn-size {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold-glorious);
            color: var(--gold-primary);
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Crimson Pro', serif;
        }

        .btn-size.active {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious));
            color: #051A10;
        }

        .btn-audio {
            flex: 1;
            background: linear-gradient(135deg, var(--gold-glorious), var(--gold-dark));
            color: #051A10;
            border: none;
            padding: 6px;
            font-family: 'Crimson Pro', serif;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .btn-toggle-tr {
            background: rgba(11, 43, 27, 0.9);
            border: 1px solid var(--gold-glorious);
            color: var(--gold-light);
            padding: 6px 10px;
            font-family: 'Crimson Pro', serif;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Viewport Lembaran */
        .verse-viewport {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .verse-page {
            width: 100%;
            height: 100%;
            background: rgba(5, 25, 15, 0.55);
            border: 1px dashed rgba(212, 175, 55, 0.45);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        }

        .verse-page::-webkit-scrollbar {
            width: 5px;
        }
        .verse-page::-webkit-scrollbar-thumb {
            background: var(--gold-glorious);
            border-radius: 3px;
        }

        .verse-item {
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding-bottom: 10px;
        }

        .verse-item:last-child {
            border-bottom: none;
        }

        /* Teks Arab 3D Gold Mewah dengan ukuran dinamis untuk lansia */
        .arabic-text {
            font-family: 'Amiri', serif;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF5C0 0%, #F8E49A 30%, #D4AF37 70%, #9A7B1C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 3px 5px rgba(0, 0, 0, 0.85), 0 0 12px rgba(212, 175, 55, 0.3);
            text-align: right;
            line-height: 2.5;
            direction: rtl;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* Ukuran Font Dinamis */
        .size-sedang { font-size: 2rem; }
        .size-besar { font-size: 2.5rem; }
        .size-sangat-besar { font-size: 3.1rem; line-height: 2.8; }

        .translation-text {
            font-size: 0.95rem;
            color: var(--text-latin);
            line-height: 1.4;
            text-align: left;
            font-weight: 500;
        }

        .focus-mode .arabic-text {
            text-align: center;
            margin-bottom: 0;
        }

        .focus-mode .translation-text {
            display: none;
        }

        .focus-mode .verse-item {
            text-align: center;
            padding: 12px 0;
        }

        /* Navigasi Bawah */
        .page-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
            z-index: 3;
            align-items: center;
        }

        .nav-info {
            font-size: 0.85rem;
            color: var(--gold-primary);
            font-weight: 700;
            text-align: center;
            min-width: 90px;
        }

        .btn-nav {
            flex: 1;
            background: linear-gradient(135deg, var(--gold-glorious), var(--gold-dark));
            color: #051A10;
            border: none;
            padding: 8px;
            font-family: 'Crimson Pro', serif;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px var(--shadow-color);
        }

        .status-message {
            text-align: center;
            font-size: 1rem;
            color: var(--gold-primary);
            font-weight: 600;
            margin: auto;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>

        <header class="header">
            <h1 class="header-title">سورة يس</h1>
            <div class="header-meta">
                <span>Surah ke-36 • 83 Ayat</span>
            </div>
            <div class="developer-container">
                <div class="live-indicator"></div>
                <div class="developer-tag">developer : fatur62</div>
            </div>
        </header>

        <!-- Panel Kontrol Lansia Terbuka Langsung -->
        <div class="lansia-controls">
            <div class="control-row">
                <span class="control-label"><i class="fa-solid fa-text-height"></i> Ukuran Huruf:</span>
                <div class="font-size-buttons">
                    <button class="btn-size" onclick="changeFontSize('sedang')">Sedang</button>
                    <button class="btn-size active" onclick="changeFontSize('besar')">Besar</button>
                    <button class="btn-size" onclick="changeFontSize('sangat-besar')">Sangat Besar</button>
                </div>
            </div>
            <div class="control-row">
                <button class="btn-audio" id="audioBtn" onclick="toggleAudio()"><i class="fa-solid fa-volume-high"></i> Putar Audio Murotal</button>
                <button class="btn-toggle-tr" id="toggleTrBtn" onclick="toggleTranslation()">Sembunyi Arti</button>
            </div>
        </div>

        <!-- Viewport -->
        <main class="verse-viewport" id="verseViewport">
            <div class="status-message" id="statusMessage">Memuat lembaran Surah Yasin...</div>
        </main>

        <!-- Footer Nav -->
        <div class="page-nav">
            <button class="btn-nav" onclick="prevPage()">❮ Sebelumnya</button>
            <span class="nav-info" id="navInfo">Hal 1 / -</span>
            <button class="btn-nav" onclick="nextPage()">Selanjutnya ❯</button>
        </div>
    </div>

    <!-- Audio Murotal Yasin (Surah 36) -->
    <audio id="murotalAudio" src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/36.mp3" preload="none"></audio>

    <script>
        let allAyat = [];
        let pagesData = [];
        let currentPageIndex = 0;
        let showTranslation = true;
        let currentFontSize = 'size-besar'; 
        const AYAT_PER_HALAMAN = 4;

        async function fetchSurahData() {
            try {
                const resCorrect = await fetch('https://equran.id/api/v2/surat/36');
                if (resCorrect.ok) {
                    const json = await resCorrect.json();
                    if (json && json.data && Array.isArray(json.data.ayat)) {
                        return json.data.ayat.map(item => ({
                            nomorAyat: item.nomorAyat,
                            teksArab: item.teksArab,
                            teksIndonesia: item.teksIndonesia
                        }));
                    }
                }
            } catch (err) { console.warn('API Utama gagal'); }

            try {
                const resFallback = await fetch('https://api.alquran.cloud/v1/surah/36/editions/quran-uthmani,id.indonesian');
                if (resFallback.ok) {
                    const jsonFb = await resFallback.json();
                    if (jsonFb && jsonFb.data && jsonFb.data.length >= 2) {
                        const arAyahs = jsonFb.data[0].ayahs;
                        const idAyahs = jsonFb.data[1].ayahs;
                        return arAyahs.map((item, index) => ({
                            nomorAyat: item.numberInSurah,
                            teksArab: item.text,
                            teksIndonesia: idAyahs[index] ? idAyahs[index].text : ''
                        }));
                    }
                }
            } catch (err) { console.error('API Cadangan gagal'); }

            throw new Error('Gagal mengambil data ayat');
        }

        async function initSurahYasin() {
            const statusMsg = document.getElementById('statusMessage');
            try {
                const ayatData = await fetchSurahData();
                allAyat = ayatData;
                pagesData = [];
                for (let i = 0; i < allAyat.length; i += AYAT_PER_HALAMAN) {
                    pagesData.push(allAyat.slice(i, i + AYAT_PER_HALAMAN));
                }
                renderCurrentPage(0);
            } catch (error) {
                if (statusMsg) statusMsg.innerText = 'Gagal memuat ayat. Periksa koneksi internet.';
            }
        }

        function renderCurrentPage(pageIndex) {
            if (pagesData.length === 0) return;
            currentPageIndex = pageIndex;

            const viewport = document.getElementById('verseViewport');
            document.getElementById('navInfo').innerText = `Hal ${currentPageIndex + 1} / ${pagesData.length}`;

            const currentAyatList = pagesData[currentPageIndex];
            const pageDiv = document.createElement('div');
            pageDiv.className = `verse-page ${showTranslation ? '' : 'focus-mode'}`;
            pageDiv.id = 'activeVersePage';

            let contentHTML = '';
            currentAyatList.forEach(ayat => {
                contentHTML += `
                    <div class="verse-item">
                        <div class="arabic-text ${currentFontSize}">${ayat.teksArab} ﴿${ayat.nomorAyat}﴾</div>
                        <div class="translation-text"><strong>${ayat.nomorAyat}.</strong> ${ayat.teksIndonesia}</div>
                    </div>
                `;
            });

            pageDiv.innerHTML = contentHTML;
            viewport.innerHTML = '';
            viewport.appendChild(pageDiv);
        }

        function nextPage() {
            if (currentPageIndex < pagesData.length - 1) {
                renderCurrentPage(currentPageIndex + 1);
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                renderCurrentPage(currentPageIndex - 1);
            }
        }

        function changeFontSize(size) {
            currentFontSize = size === 'sedang' ? 'size-sedang' : (size === 'sangat-besar' ? 'size-sangat-besar' : 'size-besar');
            
            document.querySelectorAll('.btn-size').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const activePage = document.getElementById('activeVersePage');
            if (activePage) {
                activePage.querySelectorAll('.arabic-text').forEach(el => {
                    el.className = `arabic-text ${currentFontSize}`;
                });
            }
        }

        function toggleTranslation() {
            showTranslation = !showTranslation;
            const appCard = document.getElementById('appCard');
            const activePage = document.getElementById('activeVersePage');
            const btn = document.getElementById('toggleTrBtn');

            if (showTranslation) {
                appCard.classList.remove('focus-mode');
                if (activePage) activePage.classList.remove('focus-mode');
                btn.innerText = 'Sembunyi Arti';
            } else {
                appCard.classList.add('focus-mode');
                if (activePage) activePage.classList.add('focus-mode');
                btn.innerText = 'Tampil Arti';
            }
        }

        function toggleAudio() {
            const audio = document.getElementById('murotalAudio');
            const btn = document.getElementById('audioBtn');

            if (audio.paused) {
                audio.play();
                btn.innerHTML = `<i class="fa-solid fa-pause"></i> Jeda Audio`;
                btn.style.background = 'linear-gradient(135deg, #FF6B6B, #C92A2A)';
                btn.style.color = '#FFFFFF';
            } else {
                audio.pause();
                btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Putar Audio Murotal`;
                btn.style.background = 'linear-gradient(135deg, var(--gold-glorious), var(--gold-dark))';
                btn.style.color = '#051A10';
            }
        }

        window.addEventListener('load', () => { initSurahYasin(); });
    </script>
</body>
</html>
