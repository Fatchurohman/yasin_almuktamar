<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yasin Glorious Emerald Edition</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark-emerald: #0B2B1B;
            --bg-parchment-green: #0E3522;
            --gold-light: #F8E49A;
            --gold-primary: #E5C158;
            --gold-glorious: #D4AF37;
            --gold-dark: #9A7B1C;
            --gold-deep: #5E4A0F;
            --shadow-color: rgba(3, 15, 9, 0.6);
            --text-arabic: #FDF0CD;
            --text-latin: #E0EADF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05140C;
            font-family: 'Crimson Pro', serif;
        }

        /* Fullscreen Mobile Viewport Application */
        .app-card {
            background-color: var(--bg-parchment-green);
            background-image: radial-gradient(#14482E 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 0 60px var(--shadow-color);
            
            /* Artistic Glorious Gold Border Style */
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        /* Shimmer / Light Glow Effect on Frame */
        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(254, 238, 185, 0.3) 50%,
                transparent 55%
            );
            transform: rotate(30deg);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        /* Corner Arabesque Ornaments */
        .corner-ornament {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 3px solid var(--gold-glorious);
            z-index: 2;
            pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .corner-tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .corner-br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        /* Header Styles */
        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-glorious);
            padding-bottom: 8px;
            margin-bottom: 6px;
            position: relative;
            z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 2.1rem;
            color: var(--gold-light);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.6);
            margin-bottom: 2px;
        }

        .header-meta {
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        /* Developer Tag with Live Streaming Indicator */
        .developer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
        }

        .live-indicator {
            width: 7px;
            height: 7px;
            background-color: #00FF66;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(0, 255, 102, 0.4);
            animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(0, 255, 102, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 102, 0);
            }
        }

        .developer-tag {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Controls / Toggle */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            z-index: 3;
            padding: 0 4px;
        }

        .nav-info {
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-weight: 700;
        }

        .btn-toggle {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            color: #082114;
            border: 1px solid var(--gold-dark);
            padding: 5px 12px;
            font-family: 'Crimson Pro', serif;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        /* Page Flip / Curl Container */
        .verse-viewport {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            perspective: 1200px;
        }

        .verse-page {
            width: 100%;
            height: 100%;
            background: rgba(5, 25, 15, 0.45);
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s ease;
            backface-visibility: hidden;
        }

        /* Custom Scrollbar for Page Content */
        .verse-page::-webkit-scrollbar {
            width: 4px;
        }
        .verse-page::-webkit-scrollbar-thumb {
            background: var(--gold-glorious);
            border-radius: 2px;
        }

        /* Page Flip Animation Classes */
        .flip-left {
            transform: rotateY(-90deg) translateX(-50px);
            opacity: 0;
        }

        .flip-right {
            transform: rotateY(90deg) translateX(50px);
            opacity: 0;
        }

        .verse-item {
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 12px;
        }

        .verse-item:last-child {
            border-bottom: none;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--text-arabic);
            text-align: right;
            line-height: 2.3;
            direction: rtl;
            margin-bottom: 8px;
            text-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
