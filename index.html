<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yasin Glorious Emerald Edition</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark-emerald: #0B2B1B;
            --bg-parchment-green: #0E3522;
            --gold-light: #F8E49A;
            --gold-primary: #E5C158;
            --gold-glorious: #D4AF37;
            --gold-dark: #9A7B1C;
            --gold-deep: #5E4A0F;
            --shadow-color: rgba(3, 15, 9, 0.6);
            --text-arabic: #FDF0CD;
            --text-latin: #E0EADF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05140C;
            font-family: 'Crimson Pro', serif;
        }

        /* Fullscreen Mobile Viewport Application */
        .app-card {
            background-color: var(--bg-parchment-green);
            background-image: radial-gradient(#14482E 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 0 60px var(--shadow-color);
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        /* Shimmer / Light Glow Effect on Frame */
        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(254, 238, 185, 0.3) 50%,
                transparent 55%
            );
            transform: rotate(30deg);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        /* Corner Arabesque Ornaments */
        .corner-ornament {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 3px solid var(--gold-glorious);
            z-index: 2;
            pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .corner-tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .corner-br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        /* Header Styles */
        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-glorious);
            padding-bottom: 8px;
            margin-bottom: 6px;
            position: relative;
            z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 2.1rem;
            color: var(--gold-light);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.6);
            margin-bottom: 2px;
        }

        .header-meta {
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        /* Developer Tag with Live Streaming Indicator */
        .developer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
        }

        .live-indicator {
            width: 7px;
            height: 7px;
            background-color: #00FF66;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(0, 255, 102, 0.4);
            animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(0, 255, 102, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 102, 0);
            }
        }

        .developer-tag {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Controls / Toggle */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            z-index: 3;
            padding: 0 4px;
        }

        .nav-info {
            font-size: 0.9rem;
            color: var(--gold-primary);
            font-weight: 700;
        }

        .btn-toggle {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            color: #082114;
            border: 1px solid var(--gold-dark);
            padding: 5px 12px;
            font-family: 'Crimson Pro', serif;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        /* Page Flip / Curl Container */
        .verse-viewport {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            perspective: 1200px;
        }

        .verse-page {
            width: 100%;
            height: 100%;
            background: rgba(5, 25, 15, 0.45);
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s ease;
            backface-visibility: hidden;
        }

        .verse-page::-webkit-scrollbar {
            width: 4px;
        }
        .verse-page::-webkit-scrollbar-thumb {
            background: var(--gold-glorious);
            border-radius: 2px;
        }

        .flip-left {
            transform: rotateY(-90deg) translateX(-50px);
            opacity: 0;
        }

        .flip-right {
            transform: rotateY(90deg) translateX(50px);
            opacity: 0;
        }

        .verse-item {
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 12px;
        }

        .verse-item:last-child {
            border-bottom: none;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--text-arabic);
            text-align: right;
            line-height: 2.3;
            direction: rtl;
            margin-bottom: 8px;
            text-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        .translation-text {
            font-size: 1rem;
            color: var(--text-latin);
            line-height: 1.5;
            text-align: left;
        }

        .focus-mode .arabic-text {
            text-align: center;
            font-size: 2.3rem;
            margin-bottom: 0;
        }

        .focus-mode .translation-text {
            display: none;
        }

        .focus-mode .verse-item {
            text-align: center;
            padding: 15px 0;
        }

        .page-nav {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
            z-index: 3;
        }

        .btn-nav {
            flex: 1;
            background: linear-gradient(135deg, var(--gold-glorious), var(--gold-dark));
            color: #051A10;
            border: none;
            padding: 9px;
            font-family: 'Crimson Pro', serif;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px var(--shadow-color);
        }

        .btn-nav:active {
            filter: brightness(0.9);
        }

        .status-message {
            text-align: center;
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: 600;
            margin: auto;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        <!-- Corner Ornaments -->
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>

        <!-- Header -->
        <header class="header">
            <h1 class="header-title">سورة يس</h1>
            <div class="header-meta">
                <span>Surah ke-36</span>
                <span>•</span>
                <span>Makkiyah</span>
                <span>•</span>
                <span>83 Ayat</span>
            </div>
            <div class="developer-container">
                <div class="live-indicator"></div>
                <div class="developer-tag">developer : fatur62</div>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls">
            <span class="nav-info" id="navInfo">Halaman 1 / -</span>
            <button class="btn-toggle" id="toggleBtn" onclick="toggleTranslation()">Sembunyikan Terjemahan</button>
        </div>

        <!-- Page Flip Viewport -->
        <main class="verse-viewport" id="verseViewport">
            <div class="status-message" id="statusMessage">Memuat lembaran Surah Yasin...</div>
        </main>

        <!-- Navigation Buttons -->
        <div class="page-nav">
            <button class="btn-nav" onclick="prevPage()">❮ Sebelumnya</button>
            <button class="btn-nav" onclick="nextPage()">Selanjutnya ❯</button>
        </div>
    </div>

    <script>
        let allAyat = [];
        let pagesData = [];
        let currentPageIndex = 0;
        let showTranslation = true;
        let audioCtx = null;
        const AYAT_PER_HALAMAN = 5;

        function playPaperFlipSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
                filter.Q.setValueAtTime(2, audioCtx.currentTime);

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                noise.start();
            } catch (e) {
                // Ignore audio autoplay restrictions
            }
        }

        async function fetchSurahData() {
            // Primary API
            try {
                const res = await fetch('https://equran.id/api/v2/surat/36');
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.data && Array.isArray(json.data.ayat)) {
                        return json.data.ayat.map(item => ({
                            nomorAyat: item.nomorAyat,
                            teksArab: item.teksArab,
                            teksIndonesia: item.teksIndonesia
                        }));
                    }
                }
            } catch (err) {
                console.warn('API Utama gagal, mencoba API Cadangan...', err);
            }

            // Fallback API (Al-Quran Cloud)
            try {
                const resFallback = await fetch('https://api.alquran.cloud/v1/surah/36/editions/quran-uthmani,id.indonesian');
                if (resFallback.ok) {
                    const jsonFb = await resFallback.json();
                    if (jsonFb && jsonFb.data && jsonFb.data.length >= 2) {
                        const arAyahs = jsonFb.data[0].ayahs;
                        const idAyahs = jsonFb.data[1].ayahs;
                        return arAyahs.map((item, index) => ({
                            nomorAyat: item.numberInSurah,
                            teksArab: item.text,
                            teksIndonesia: idAyahs[index] ? idAyahs[index].text : ''
                        }));
                    }
                }
            } catch (err) {
                console.error('API Cadangan juga gagal:', err);
            }

            throw new Error('Gagal mengambil data ayat dari seluruh server');
        }

        async function initSurahYasin() {
            const statusMsg = document.getElementById('statusMessage');
            try {
                const ayatData = await fetchSurahData();
                if (!ayatData || ayatData.length === 0) {
                    throw new Error('Data ayat kosong');
                }

                allAyat = ayatData;
                pagesData = [];
                for (let i = 0; i < allAyat.length; i += AYAT_PER_HALAMAN) {
                    pagesData.push(allAyat.slice(i, i + AYAT_PER_HALAMAN));
                }

                renderCurrentPage(0, 'right');
            } catch (error) {
                console.error(error);
                if (statusMsg) {
                    statusMsg.style.color = '#FF6B6B';
                    statusMsg.innerText = 'Gagal memuat ayat. Silakan periksa koneksi internet atau muat ulang halaman.';
                }
            }
        }

        function renderCurrentPage(pageIndex, direction) {
            if (pagesData.length === 0) return;
            currentPageIndex = pageIndex;

            const viewport = document.getElementById('verseViewport');
            const navInfo = document.getElementById('navInfo');
            navInfo.innerText = `Halaman ${currentPageIndex + 1} / ${pagesData.length}`;

            const currentAyatList = pagesData[currentPageIndex];

            const pageDiv = document.createElement('div');
            pageDiv.className = `verse-page ${direction === 'right' ? 'flip-right' : 'flip-left'} ${showTranslation ? '' : 'focus-mode'}`;
            pageDiv.id = 'activeVersePage';

            let contentHTML = '';
            currentAyatList.forEach(ayat => {
                const nomorAyat = ayat.nomorAyat || '';
                const teksArab = ayat.teksArab || '';
                const teksIndonesia = ayat.teksIndonesia || '';

                contentHTML += `
                    <div class="verse-item">
                        <div class="arabic-text">${teksArab} ﴿${nomorAyat}﴾</div>
                        <div class="translation-text"><strong>${nomorAyat}.</strong> ${teksIndonesia}</div>
                    </div>
                `;
            });

            pageDiv.innerHTML = contentHTML;
            viewport.innerHTML = '';
            viewport.appendChild(pageDiv);

            setTimeout(() => {
                pageDiv.classList.remove('flip-right', 'flip-left');
            }, 20);
        }

        function nextPage() {
            if (currentPageIndex < pagesData.length - 1) {
                playPaperFlipSound();
                animateFlipAndSwitch(currentPageIndex + 1, 'right');
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                playPaperFlipSound();
                animateFlipAndSwitch(currentPageIndex - 1, 'left');
            }
        }

        function animateFlipAndSwitch(newPageIndex, dir) {
            const currentPage = document.getElementById('activeVersePage');
            if (currentPage) {
                currentPage.classList.add(dir === 'right' ? 'flip-left' : 'flip-right');
            }
            setTimeout(() => {
                renderCurrentPage(newPageIndex, dir);
            }, 300);
        }

        function toggleTranslation() {
            const appCard = document.getElementById('appCard');
            const toggleBtn = document.getElementById('toggleBtn');
            const activePage = document.getElementById('activeVersePage');
            
            showTranslation = !showTranslation;

            if (showTranslation) {
                appCard.classList.remove('focus-mode');
                if (activePage) activePage.classList.remove('focus-mode');
                toggleBtn.innerText = 'Sembunyikan Terjemahan';
            } else {
                appCard.classList.add('focus-mode');
                if (activePage) activePage.classList.add('focus-mode');
                toggleBtn.innerText = 'Tampilkan Terjemahan';
            }
        }

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                nextPage();
            }
            if (touchEndX > touchStartX + 50) {
                prevPage();
            }
        }

        window.addEventListener('load', () => {
            initSurahYasin();
        });
    </script>
</body>
</html>
